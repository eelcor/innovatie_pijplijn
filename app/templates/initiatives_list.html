{% extends "base.html" %}

{% block title %}Initiatieven — Innovatiepijplijn{% endblock %}

{% set active_page = 'initiatieven' %}

{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">Initiatieven</h1>
    <p class="page-subtitle">Alle geregistreerde innovatie-initiatieven</p>
  </div>
  <div class="header-actions">
    <!-- View toggle: cards / list -->
    <div class="view-toggle" id="view-toggle-group">
      <button class="view-toggle-btn active" id="btn-view-cards" onclick="switchView('cards')" title="Tegels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </button>
      <button class="view-toggle-btn" id="btn-view-list" onclick="switchView('list')" title="Lijst">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Zoeken..." id="search-input">
      <kbd>⌘K</kbd>
    </div>
    <a href="{{ url_for('export_excel') }}" class="btn btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7,10 12,15 17,10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export Excel
    </a>
    <button class="btn btn-primary" onclick="openModal('new-initiative')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nieuw initiatief
    </button>
  </div>
</header>

<!-- Filter dropdown panel -->
{% include "partials/filter_panel.html" %}

<!-- Initiatives container -->
<div id="initiatives-container"></div>

<!-- Result count -->
<div id="result-count" style="margin-top: 8px; font-size: 12px; color: var(--muted); text-align: right;"></div>
{% endblock %}
