{# Partial: AI hypothese-suggesties voor een initiatief #}
<div id="ai-hypothesis-suggest" style="padding: 20px; background: var(--surface); border: 1px solid var(--border);">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" style="color: var(--accent);">
            <path d="M12 2a4 4 0 014 4v2a4 4 0 01-8 0V6a4 4 0 014-4z"/>
            <path d="M6 10v1a6 6 0 0012 0v-1"/>
            <path d="M12 17v3"/>
            <path d="M8 20h8"/>
        </svg>
        <h3 style="font-size: 14px; font-weight: 600; color: var(--fg);">Hypothese-suggesties</h3>
    </div>
    <p style="font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5;">
        Laat het taalmodel nieuwe hypothesen voorstellen op basis van de context van dit initiatief.
    </p>

    <button
        type="button"
        hx-post="{{ url_for('ai_suggest_hypotheses', initiative_id=initiative_id) }}"
        hx-target="#ai-hypothesis-result"
        hx-indicator="#ai-hypothesis-spinner"
        class="btn btn-secondary"
        style="border-color: var(--accent); color: var(--accent);"
    >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M12 5v14M5 12h14"/>
        </svg>
        Suggesties genereren
    </button>

    <div id="ai-hypothesis-spinner" class="htmx-indicator" style="display: none; margin-top: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--muted); animation: spin 1s linear infinite;">
            <path d="M12 2a10 10 0 0110 10"/>
        </svg>
        <span style="font-size: 13px; color: var(--muted); margin-left: 6px;">Aan het genereren…</span>
    </div>

    <div id="ai-hypothesis-result" style="margin-top: 16px;">
        {% if error %}
        <div style="padding: 12px; background: #FEF2F2; border: 1px solid #FECACA; font-size: 13px; color: #DC2626; line-height: 1.5;">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>
