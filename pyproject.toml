[project]
name = "innovatiepijplijn"
version = "0.1.0"
description = "Registratie- en analysetool voor innovatie-initiatieven"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "httpx>=0.27",
    "itsdangerous>=2.0",
    "passlib[bcrypt]>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
