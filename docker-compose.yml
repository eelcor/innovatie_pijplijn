# =============================================================================
# Innovatiepijplijn — Docker Compose configuratie
# =============================================================================
# Gebruik:
#   docker compose up -d              # Start de applicatie
#   docker compose up -d --build      # Rebuild en start
#   APP_PORT=9000 docker compose up -d  # Custom poort
# =============================================================================

services:
  innovatiepijplijn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innovatiepijplijn
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Applicatie
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_ENV=${APP_ENV:-production}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:${APP_PORT:-8000}}
      # Database
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/innovatiepijplijn.db}
      - BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
      # Admin account (automatisch aangemaakt bij eerste start)
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME:-admin}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-verander-dit}
      # AI / Taalmodel
      - MODEL_URL=${MODEL_URL:-}
      - MODEL_NAME=${MODEL_NAME:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_REQUEST_TIMEOUT=${AI_REQUEST_TIMEOUT:-600}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      # Persisteer SQLite database, uploads en backups
      - innovatiepijplijn-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits voor productie
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2.0}"
          memory: ${MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${CPU_RESERVATION:-0.5}"
          memory: ${MEMORY_RESERVATION:-512M}

volumes:
  innovatiepijplijn-data:
    driver: local
